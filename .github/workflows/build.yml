name: Build .NET

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Checkout sources. Depth=0 is for using GitVersion
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

      # Install and Setup GitVersion
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.2.x'
    - name: Use GitVersion
      # Step id is used as reference for the output values
      id: gitversion 
      uses: gittools/actions/gitversion/execute@v4.7.0

      # Restore, build and test the project
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  firmware:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Arm toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libusb-1.0-0-dev

    - name: Checkout Pico SDK 2.3.0
      run: git clone --branch 2.3.0 --depth 1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"

    - name: Build Pico firmware
      env:
        PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        CMAKE_GENERATOR: Ninja
      run: bash ./firmware/build-firmware.sh

    - name: Upload firmware
      uses: actions/upload-artifact@v6
      with:
        name: pico-firmware
        path: |
          firmware/pico_portal_simulator/build/pico_portal_simulator.uf2
          firmware/pico_portal_xsm3_sidecar/build/pico_portal_xsm3_sidecar.uf2