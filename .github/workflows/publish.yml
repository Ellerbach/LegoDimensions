name: Publish .NET nuget and create release

on:
  push:
    branches: [ "main" ]

jobs:

  before_publish:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr-labels: ${{ steps.pr-labels.outputs.result }}
    steps:
    
    # This checks whether the pushed commit is associated with an open PR labeled "publish".
    - name: Get PR labels
      id: pr-labels
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        label_names=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
        if echo "$label_names" | grep -Eq '(^|[[:space:]])publish([[:space:]]|$)'; then
          echo "result=true" >> "$GITHUB_OUTPUT"
        else
          echo "result=false" >> "$GITHUB_OUTPUT"
        fi
    
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: needs.before_publish.outputs.pr-labels == 'true'
    needs: before_publish
    outputs:
      changelog: ${{ steps.github_release.outputs.changelog }}
      version: ${{ steps.gitversion.outputs.MajorMinorPatch }}
    steps:
    # Checkout sources. Depth=0 is for using GitVersion
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

      # Install and Setup GitVersion
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.2.x'
    - name: Use GitVersion
      # Step id is used as reference for the output values
      id: gitversion 
      uses: gittools/actions/gitversion/execute@v4.7.0

      # Restore, build and test the project
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Clean stale artifacts
      shell: bash
      run: |
        rm -rf ./artifacts
        mkdir -p ./artifacts

    - name: Install Pico firmware toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libusb-1.0-0-dev

    - name: Checkout Pico SDK 2.3.0
      run: |
        git init "$RUNNER_TEMP/pico-sdk"
        git -C "$RUNNER_TEMP/pico-sdk" remote add origin https://github.com/raspberrypi/pico-sdk.git
        git -C "$RUNNER_TEMP/pico-sdk" fetch --depth 1 origin 98a542c1a62fb549ffb5d66a3e5892b06276b670
        git -C "$RUNNER_TEMP/pico-sdk" checkout --detach FETCH_HEAD
        git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --recursive --depth 1

    - name: Build Pico firmware
      env:
        PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        CMAKE_GENERATOR: Ninja
      run: |
        bash ./firmware/build-firmware.sh
        cp ./firmware/pico_portal_simulator/build/pico_portal_simulator.uf2 ./artifacts/

    # Create a nuget Release
    - name: Pack the NuGet package
      run: |
        dotnet pack ./LegoDimensions \
          --configuration Release \
          --output ./artifacts \
          -p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }} \
          -p:PackageVersion=${{ steps.gitversion.outputs.MajorMinorPatch }}

    - name: Build NFC app
      run: |
        dotnet publish ./LegoDimensionsReadNfc -r linux-arm -c Release --output ./artifacts --self-contained true -p:PublishSingleFile=true
        dotnet publish ./LegoDimensionsReadNfc -r win-x64 -c Release --output ./artifacts --self-contained true -p:PublishSingleFile=true

    - name: Build Runner app
      run: |
        dotnet publish ./LegoDimensionsRunner -r linux-arm -c Release --output ./artifacts --self-contained true -p:PublishSingleFile=true
        dotnet publish ./LegoDimensionsRunner -r win-x64 -c Release --output ./artifacts --self-contained true -p:PublishSingleFile=true

    # Publish all NuGet packages to NuGet.org
    # Use --skip-duplicate to prevent errors if a package with the same version already exists.
    # If you retry a failed workflow, already published packages will be skipped without error.
    - name: Publish separate tools to NuGet
      shell: bash
      run: |
        pkg="$(find ./artifacts -maxdepth 1 -type f -name 'LegoDimensions*.nupkg' | sort | tail -n 1)"
        if [ -z "$pkg" ]; then
          echo "No LegoDimensions NuGet package found in ./artifacts"
          exit 1
        fi
        echo "Pushing $pkg"
        dotnet nuget push "$pkg" --api-key "${{ secrets.NUGET_TOOLS }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
    # Create the CHANGELOG for this release
    # We'll compile it from last the version
    # to the current commit
    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@v6
      with:
        configuration: "./changelog-config.json"
        fromTag: ${{ steps.gitversion.outputs.VersionSourceSha }}
        toTag: ${{ steps.gitversion.outputs.Sha }}
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: release-artifacts
        path: ./artifacts

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v8
      with:
        name: release-artifacts
        path: ./artifacts

    # Create GitHub release and CHANGELOG for Chocolatey and releases
    # NOTE: this is where we prepend "v" before the version in the tag/release
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        # no artifacts: ""
        body: ${{ needs.publish.outputs.changelog }}
        tag: "v${{ needs.publish.outputs.version }}"
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "artifacts/*.nupkg,artifacts/LegoDimensionsReadNfc,artifacts/LegoDimensionsRunner,artifacts/*.exe,artifacts/*.uf2"